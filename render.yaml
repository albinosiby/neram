# Neram frontend only. The existing database stays in Supabase.
# Connect GitHub to Render and grant access to albinosiby/neram.
services:
  - type: web
    name: neram-transit
    runtime: static
    repo: https://github.com/albinosiby/neram
    branch: main
    autoDeployTrigger: commit
    buildCommand: node build.mjs
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
