name: neram_mobile
description: Native Flutter client for Neram bus, railway and Metro catalogs.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: 1.5.0
  shared_preferences: 2.5.3
  flutter_svg: 2.2.1
  url_launcher: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/bus.svg
    - assets/kerala-evening.svg
    - assets/data/
