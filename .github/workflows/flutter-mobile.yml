name: Flutter mobile
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter-mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Analyze, widget tests and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'mobile/android/**/*.gradle*'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate standard platform runners
        run: flutter create --no-pub --platforms=android,ios,web --org app.neram --project-name neram_mobile .
      - name: Resolve pinned packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit and mobile widget tests
        run: flutter test --coverage
      - name: Build installable Android test APK
        run: flutter build apk --debug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: neram-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package generated platform runners and dependency lock
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('../neram-platform-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
            for folder in ['android','ios','web']:
              for path in pathlib.Path(folder).rglob('*'):
                if path.is_file() and not any(part in {'.gradle','build','Pods','.symlinks','ephemeral'} for part in path.parts) and path.name not in {'local.properties','Generated.xcconfig','flutter_export_environment.sh'}:
                  z.write(path,str(path))
            for name in ['pubspec.lock','.metadata']:
              if pathlib.Path(name).exists(): z.write(name,name)
          PY
      - name: Save platform sources, dependency lock and test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neram-mobile-build-details
          path: |
            neram-platform-sources.zip
            mobile/coverage/lcov.info
            mobile/test/failures/
          retention-days: 14
  emulator:
    name: Android emulator UI flow
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'mobile/android/**/*.gradle*'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Prepare app
        working-directory: mobile
        run: |
          flutter create --no-pub --platforms=android --org app.neram --project-name neram_mobile .
          flutter pub get
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: mobile
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d emulator-5554
      - name: Save Android emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neram-android-screenshots
          path: mobile/build/screenshots/
          if-no-files-found: warn
          retention-days: 14
